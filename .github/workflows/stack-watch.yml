# The kit's watch on its own pins (kitmaintainer-handbook.md §9.13).
#
# The kit has no package.json, so Dependabot never sees the versions in
# _claude-project/stack-manifest.json. This files the issues that tell the
# maintainer to run /review-stack:
#
#   monthly (the 26th) — pins behind latest, a few days before consumers'
#                        monthly Dependabot run on the 1st;
#   weekly (Mondays)   — a pinned version affected by a published advisory.
#
# Each keeps one open issue per label and rewrites it. Neither decides anything.

name: stack-watch

on:
  schedule:
    - cron: "0 14 26 * *"   # pins — 09:00 America/Chicago in daylight time
    - cron: "0 14 * * 1"    # advisories
  workflow_dispatch:
    inputs:
      mode:
        description: "pins or advisories"
        required: true
        default: advisories
        type: choice
        options: [pins, advisories]

permissions:
  contents: read
  issues: write

concurrency:
  group: stack-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Run the watch
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_WATCH_PROJECT_TOKEN: ${{ secrets.STACK_WATCH_PROJECT_TOKEN }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 14 26 * *' && 'pins') || 'advisories' }}
        run: bash .github/scripts/stack-watch.sh "$MODE"
