# gitflow project integration configuration.
#
# Sourced by issue_helpers.sh. Controls how /work, /link, /open-pr, and
# /deploy interact with the GitHub Project (status transitions across the
# board lifecycle). PROJECT_ID empty = feature disabled; branches and links
# still work, the project board just doesn't auto-update. The kit ships
# this file with empty subs (feature off by default).
#
# ─── Lifecycle and trigger map ────────────────────────────────────────────
#   Todo        → board default; no gitflow command fires this.
#   In Progress → /work <N>, /link <N>      (move_issue_to_in_progress)
#   Staged      → /open-pr                  (move_issue_to_staged)
#   Done        → /deploy (post-tag-push)   (move_issue_to_done)
#
# /merge intentionally does NOT transition. Staged covers the entire PR →
# CI → review → merge window; Done is reserved for "shipped to production"
# which only /deploy marks. If a consumer's board lacks Staged or Done
# columns, leave the corresponding option-ID substitution empty AND list
# it in `_intentionally_empty` (see handbook §9.8); the helper skips that
# transition silently for that consumer while remaining loud for misconfig.
#
# Failure semantics — see issue_helpers.sh header. Short version:
# PROJECT_ID empty = silent skip. PROJECT_ID set + any other ID missing or
# the GraphQL call failing = ERROR + script exits non-zero. Retry after
# fixing the cause.
#
# ─── How to enable for a new project ──────────────────────────────────────
# Values are supplied via `.claude/sync-substitutions.json`, NOT by editing
# this file directly. /sync-dev-kit substitutes the {{KEY}} markers
# below from the substitutions file on apply.
#
# 1. PROJECT_ID — run (replace <ORG> with your org or user):
#      gh api graphql -f query='{ organization(login:"<ORG>") { projectsV2(first:10) { nodes { id title } } } }'
#    (Or for user-owned projects: substitute `user(login:"<USER>")` for `organization(login:"<ORG>")`.)
#    Copy the `id` of the project you want to target.
#
# 2. STATUS_FIELD_ID + all four STATUS_*_ID option IDs — one query fetches
#    them all:
#      gh api graphql -f query='{ node(id:"<PROJECT_ID>") { ... on ProjectV2 { fields(first:20) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'
#    From the output:
#      - The Status field's `id`              → GITFLOW_STATUS_FIELD_ID
#      - "In Progress" option's `id`          → GITFLOW_STATUS_IN_PROGRESS_ID
#      - "Staged" option's `id`               → GITFLOW_STATUS_STAGED_ID
#      - "Done" option's `id`                 → GITFLOW_STATUS_DONE_ID
#    If a column doesn't exist on your project (e.g. you only use 3 states),
#    leave that key empty AND add it to `_intentionally_empty` in
#    `.claude/sync-substitutions.json` so the walkthrough stops re-prompting.
#
# 3. Set the five values in `.claude/sync-substitutions.json`. Commit the
#    substitutions file. Next /sync-dev-kit resolves the {{KEY}}
#    placeholders below into real IDs on disk. To disable the entire
#    feature: set GITFLOW_PROJECT_ID back to empty string and re-sync.
# ────────────────────────────────────────────────────────────────────────────

# GraphQL node ID of the project to track issues in (empty = feature disabled)
GITFLOW_PROJECT_ID="{{GITFLOW_PROJECT_ID}}"

# GraphQL field ID of the Status single-select field on that project
GITFLOW_STATUS_FIELD_ID="{{GITFLOW_STATUS_FIELD_ID}}"

# GraphQL option ID for "In Progress" — set by /work and /link
GITFLOW_STATUS_IN_PROGRESS_ID="{{GITFLOW_STATUS_IN_PROGRESS_ID}}"

# GraphQL option ID for "Staged" — set by /open-pr (PR is in CI/review pipeline)
GITFLOW_STATUS_STAGED_ID="{{GITFLOW_STATUS_STAGED_ID}}"

# GraphQL option ID for "Done" — set by /deploy after tag push (shipped to prod)
GITFLOW_STATUS_DONE_ID="{{GITFLOW_STATUS_DONE_ID}}"
