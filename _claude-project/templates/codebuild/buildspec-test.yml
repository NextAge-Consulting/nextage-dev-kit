# The full test suite in CodeBuild, for a project whose TEST_RUNNER is aws
# (pipeline.md §1.6; the CodeBuild project itself: infrastructure.md, "The full suite in
# CodeBuild"). Kit-owned and the same in every project: what differs between projects —
# the database credentials, the network — is the CodeBuild project's own configuration,
# never this file.
#
# The repository's pull-request webhook starts it, and so does /deploy, on main's HEAD,
# when that exact code has no pass. The CodeBuild project reports the result to the PR as
# the `full-suite` check (its buildStatusConfig context). The work is
# .claude/skills/gitflow/scripts/codebuild-suite.sh: fingerprint the code, carry an earlier
# pass on the same fingerprint forward or run `npm test`, and require the integration
# tests to have run. The fingerprint is exported as FULL_SUITE_FP, which /deploy reads.
version: 0.2

env:
  shell: bash
  variables:
    # The Session Manager plugin the database tunnel runs on, pinned to an exact release.
    SSM_PLUGIN_VERSION: "1.2.835.0"
  exported-variables:
    - FULL_SUITE_FP
    - FULL_SUITE_FROM

phases:
  install:
    runtime-versions:
      nodejs: 26
    commands:
      - npm ci
  build:
    commands:
      # A database on an instance the build cannot reach directly is reached through a
      # Session Manager port-forward to DB_TUNNEL_INSTANCE, set on the CodeBuild project
      # (infrastructure.md, "Reaching the database"). It forwards DB_PORT, 1433 when unset,
      # to the same port here and points DB_SERVER at it. Unset: no tunnel.
      - |
        if [ -n "${DB_TUNNEL_INSTANCE:-}" ]; then
          port="${DB_PORT:-1433}"
          arch=$(dpkg --print-architecture); [ "$arch" = amd64 ] && arch=64bit
          curl -fsSLo /tmp/ssm-plugin.deb "https://s3.amazonaws.com/session-manager-downloads/plugin/${SSM_PLUGIN_VERSION}/ubuntu_${arch}/session-manager-plugin.deb" \
            && dpkg -i /tmp/ssm-plugin.deb >/dev/null
          nohup aws ssm start-session --target "$DB_TUNNEL_INSTANCE" \
            --document-name AWS-StartPortForwardingSession \
            --parameters "{\"portNumber\":[\"$port\"],\"localPortNumber\":[\"$port\"]}" \
            > /tmp/db-tunnel.log 2>&1 &
          tunnel=$!
          for _ in $(seq 1 30); do
            grep -q 'Waiting for connections' /tmp/db-tunnel.log && break
            kill -0 "$tunnel" 2>/dev/null || break
            sleep 1
          done
          if grep -q 'Waiting for connections' /tmp/db-tunnel.log; then
            export DB_SERVER=localhost DB_PORT="$port"
          else
            echo "The database tunnel to $DB_TUNNEL_INSTANCE did not open:"
            cat /tmp/db-tunnel.log
            false
          fi
        fi
      # Buildspec 0.2 runs a phase's commands in one shell, so DB_SERVER and DB_PORT
      # exported above reach the suite.
      - bash .claude/skills/gitflow/scripts/codebuild-suite.sh --out /tmp/full-suite.env
      - . /tmp/full-suite.env
  post_build:
    commands:
      # Session Manager keeps a session open until it idles out after the client is gone,
      # so the build ends the tunnel's own session. A failure here never fails the build.
      - |
        if [ -f /tmp/db-tunnel.log ]; then
          session=$(sed -n 's/^Starting session with SessionId: //p' /tmp/db-tunnel.log)
          [ -z "$session" ] || aws ssm terminate-session --session-id "$session" >/dev/null \
            || echo "Couldn't end the database tunnel's session $session; Session Manager ends it when it idles out."
        fi
