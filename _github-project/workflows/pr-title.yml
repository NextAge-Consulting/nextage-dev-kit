# pr-title: the PR title must be a conventional commit subject.
# Full design + rationale: https://github.com/NextAge-Consulting/nextage-dev-kit/blob/main/project-documentation/pipeline.md#31-pr-titleyml
#
# Checks the PR TITLE only — branch commits are NOT checked.
# - Repo squash-merges with `commit title = PR_TITLE`. Branch commits
#   are discarded; the PR title is what lands on main, and /deploy reads
#   those subjects to pick the version bump and write the changelog.
# - Local gitflow does NOT validate commit messages. /commit and /ship-main
#   instruct Claude to compose a conventional message from
#   `.claude/skills/gitflow/references/commit-types.md`; commit.sh and
#   ship-main.sh commit whatever message they are given. A /ship-main commit
#   reaches main with no PR, so this check never sees it.
# - Dependabot/Renovate produce malformed branch commits regularly
#   (Dependabot double-scopes `chore(deps)(deps):` even when
#   `include: scope` is absent from dependabot.yml). Per-commit checking
#   would block clean-squash merges. Title-only sidesteps this.
#
# Its own workflow, not a job in ci.yml, because it must re-run when the title
# is EDITED — that is how a failed title is fixed. ci.yml does not run on
# `edited`; adding it there would re-run every test on each title or
# description edit, and its cancel-in-progress would cancel a test run still
# going.
#
# Uses commitlint with .commitlintrc.json at repo root. Its parser regex
# tolerates emoji-prefix subjects (`✨ feat: ...`); its type list must match the
# gitflow skill's references/commit-types.md.

name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title-check:
    name: title-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - name: Install commitlint
        # Pinned, and pinned to the SAME versions .claude/stack-manifest.json
        # blesses — scripts/check-stack.mjs asserts these two strings appear
        # here, so the workflow and the manifest cannot drift apart silently.
        # An unpinned install on a runner executes whatever the registry serves
        # under that name, and --no-save leaves no record of what ran.
        run: npm install --no-save @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --config .commitlintrc.json
