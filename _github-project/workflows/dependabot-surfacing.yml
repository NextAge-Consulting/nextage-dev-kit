# Dependabot surfacing — pulls open Dependabot security alerts into visible
# tracking issues so they land on the project board.
#
# ─── Why this workflow exists ──────────────────────────────────────────────
# Dependabot posts security advisories into github.com/{{OWNER_REPO}}/security/dependabot,
# a dashboard that small teams without a dedicated devops role do not open.
# Advisories that Dependabot cannot auto-patch (transitive deps pinned by a
# parent package, upstream conflict, etc.) sit there silently. For this
# project the only surface we look at is the GitHub Project board, so any
# alert that needs human action MUST become an issue in the repo — which the
# project's "Auto-add to project" workflow then pulls onto the board.
#
# Constitution §X Fail Fast, Fail Loud: "every error MUST be visible to the
# user." This workflow closes a real gap where advisories had been
# accumulating invisibly.
#
# ─── What it does ──────────────────────────────────────────────────────────
# On each run:
#   1. Fetches every OPEN Dependabot alert via the REST API.
#   2. Groups by package name (one tracking issue per package, not per GHSA,
#      because fixes are per-package).
#   3. Reconciles against existing tracking issues (labeled `dependabot-alert`):
#      - New package with alerts → create a tracking issue
#      - Existing tracking issue, package still has alerts → refresh body
#      - Existing tracking issue, package has no open alerts → close it
#
# Issues land in the repo. The repo's GitHub Project "Auto-add to project"
# built-in workflow (filter: `is:issue repo:{{OWNER_REPO}}`) picks
# them up automatically. No project-write permission needed from this
# workflow.
#
# ─── Triggers ──────────────────────────────────────────────────────────────
# - Weekly cron (Mondays 14:00 UTC ≈ Mondays 09:00 CT — start of week review)
# - workflow_dispatch (manual trigger for testing or ad-hoc refresh)
#
# OPTIONAL post-deploy refresh: to re-reconcile right after a deploy ships
# (instead of waiting for the weekly cron), add a `workflow_run` trigger to
# the `on:` block below naming THIS repo's deploy workflow(s) by their `name:`
# value, e.g.:
#     workflow_run:
#       workflows: [Deploy to Production]
#       types: [completed]
# and gate the job on success — see the commented `if:` on the `surface` job.
# Kept out of the generic template because deploy-workflow names are
# project-specific; the cron + manual dispatch cover the baseline.
#
# ─── Auth / permissions ───────────────────────────────────────────────────
# Uses the `{{RELEASE_BOT_APP}}` GitHub App installation token — NOT
# GITHUB_TOKEN — because GITHUB_TOKEN cannot read Dependabot alerts on
# org-owned private repos (returns HTTP 403 "Resource not accessible by
# integration" regardless of workflow-level `permissions:` declarations).
# This was the failure mode on this workflow's first real run.
#
# The `{{RELEASE_BOT_APP}}` App must have these repository permissions:
#   - Dependabot alerts: Read-only  (the load-bearing one)
#   - Issues: Read and write         (create / edit / close tracking issues)
#   - Metadata: Read-only            (default)
#   - Contents: Read-only            (for checkout)
#
# After updating App permissions at
#   github.com/organizations/{{ORG}}/settings/apps/<slug>/permissions
# each installation owner must accept the permission request at
#   github.com/organizations/{{ORG}}/settings/installations
#
# The workflow-level `permissions:` block below restricts the GITHUB_TOKEN
# that still exists in the workflow (used for label creation via the gh
# CLI, which doesn't strictly need the App token). Everything that touches
# /dependabot/alerts uses the App token explicitly.
# ────────────────────────────────────────────────────────────────────────────

name: dependabot-surfacing
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
  # OPTIONAL: uncomment + name this repo's deploy workflow(s) to also refresh
  # right after a deploy ships (see the "Triggers" header comment above):
  # workflow_run:
  #   workflows: [Deploy to Production]
  #   types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-surfacing
  cancel-in-progress: false

jobs:
  # ─── Self-gate on bot-App configuration ────────────────────────────────────
  # This workflow's load-bearing dependency is a GitHub App installation token,
  # minted from the `BOT_APP_CLIENT_ID` / `BOT_APP_PRIVATE_KEY` repo/org secrets.
  # Those secrets cannot be supplied by /sync-starter-kit's substitution engine
  # (substitution injects strings into files; it cannot create GHA secrets). A
  # repo that syncs this template WITHOUT installing the bot App would otherwise
  # have a standing-red scheduled workflow that fails at the token-mint step on
  # every cron tick. Instead we gate at runtime: `secrets` is not available in a
  # job-level `if:`, so a cheap preflight job maps the secret's PRESENCE to an
  # output, and the real job runs only when it's set. Absent → the `surface` job
  # is skipped (neutral, not failed), with a notice annotation explaining how to
  # enable. This is the kit's progressive-gating model applied at the Actions
  # layer: ship always, inert until configured, self-activating the moment the
  # bot secret lands — no re-sync, no cherry-picking this file out at sync time.
  preflight:
    name: Check release-bot App is configured
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          # Presence-only check. The value is redacted in logs; we test -n, never print it.
          BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_APP_CLIENT_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release-bot App secret present — proceeding."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dependabot-surfacing skipped::BOT_APP_CLIENT_ID secret is not set — this repo has no release-bot GitHub App installed, so Dependabot-alert reconciliation is disabled. Install the bot App and add BOT_APP_CLIENT_ID + BOT_APP_PRIVATE_KEY secrets (HANDBOOK §11.3) to activate."
          fi

  surface:
    name: Reconcile Dependabot tracking issues
    runs-on: ubuntu-latest
    needs: preflight
    # Two gates ANDed:
    #   1. preflight: only run when the bot-App secret is configured (see above).
    #   2. workflow_run success: no-op for cron/dispatch (the event is never
    #      'workflow_run'). If you add the OPTIONAL post-deploy `workflow_run`
    #      trigger above, this ensures we only reconcile after a SUCCESSFUL
    #      deploy — a failed deploy leaves prod state unknown, so we don't
    #      update tracking issues against an ambiguous baseline.
    if: >-
      needs.preflight.outputs.enabled == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (for npm ls classification)
        run: npm ci --ignore-scripts

      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Retry transient GitHub API failures (5xx, 429, network blips).
          # Permanent 4xx (auth, validation) fails fast on first response.
          # 5 attempts, 2→32s exponential backoff (~62s ceiling).
          gh_retry() {
            local max=5 attempt=1 delay=2 err_file rc
            err_file=$(mktemp)
            while :; do
              if "$@" 2>"$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return 0
              fi
              rc=$?
              if [ "$attempt" -ge "$max" ] || ! grep -qiE '5[0-9]{2}|bad gateway|gateway timeout|service unavailable|rate limit|429|timeout|connection reset|EOF' "$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return "$rc"
              fi
              echo "::warning::transient gh failure (attempt $attempt/$max, sleeping ${delay}s): $(head -c 200 "$err_file")" >&2
              sleep "$delay"
              attempt=$((attempt+1)); delay=$((delay*2))
            done
          }
          create_label() {
            local name="$1" color="$2" desc="$3"
            gh_retry gh label create "$name" --color "$color" --description "$desc" --force >/dev/null
          }
          # Marker label for this workflow's tracking issues. Distinct from
          # the `dependencies` label Dependabot uses on its own PRs, so queries
          # don't collide.
          create_label "dependabot-alert"  "B60205" "Tracking issue for open Dependabot security alert(s)"
          create_label "security"          "EE0701" "Security-related"
          create_label "severity-critical" "B60205" "Dependabot-reported critical severity"
          create_label "severity-high"     "D93F0B" "Dependabot-reported high severity"
          create_label "severity-medium"   "FBCA04" "Dependabot-reported medium severity"
          create_label "severity-low"      "0E8A16" "Dependabot-reported low severity"

      - name: Fetch open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh_retry() {
            local max=5 attempt=1 delay=2 err_file rc
            err_file=$(mktemp)
            while :; do
              if "$@" 2>"$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return 0
              fi
              rc=$?
              if [ "$attempt" -ge "$max" ] || ! grep -qiE '5[0-9]{2}|bad gateway|gateway timeout|service unavailable|rate limit|429|timeout|connection reset|EOF' "$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return "$rc"
              fi
              echo "::warning::transient gh failure (attempt $attempt/$max, sleeping ${delay}s): $(head -c 200 "$err_file")" >&2
              sleep "$delay"
              attempt=$((attempt+1)); delay=$((delay*2))
            done
          }
          # Pull all open alerts. Persist raw JSON for downstream steps.
          gh_retry gh api "/repos/${{ github.repository }}/dependabot/alerts?state=open" \
            --paginate \
            --jq '.' > /tmp/alerts-raw.json

          # Normalize into one record per advisory: package, severity, GHSA,
          # patched version, summary, manifest path.
          jq '[.[] | {
            package: .dependency.package.name,
            ecosystem: .dependency.package.ecosystem,
            manifest: .dependency.manifest_path,
            severity: .security_advisory.severity,
            ghsa: .security_advisory.ghsa_id,
            cve: (.security_advisory.cve_id // ""),
            summary: .security_advisory.summary,
            patched: (.security_vulnerability.first_patched_version.identifier // "NONE"),
            vuln_range: .security_vulnerability.vulnerable_version_range,
            alert_number: .number,
            html_url: .html_url
          }]' /tmp/alerts-raw.json > /tmp/alerts-flat.json

          # Group by package name. Keep the highest severity for labeling.
          SEVERITY_RANK='{"critical":4,"high":3,"medium":2,"low":1}'
          jq --argjson rank "$SEVERITY_RANK" '
            group_by(.package) | map({
              package: .[0].package,
              ecosystem: .[0].ecosystem,
              count: length,
              highest_severity: (max_by($rank[.severity] // 0).severity),
              alerts: sort_by($rank[.severity] // 0) | reverse
            })
          ' /tmp/alerts-flat.json > /tmp/alerts-grouped.json

          TOTAL=$(jq 'length' /tmp/alerts-grouped.json)
          echo "Found $TOTAL package(s) with open alerts"
          jq -r '.[] | "  - \(.package): \(.count) alert(s), highest=\(.highest_severity)"' /tmp/alerts-grouped.json

      - name: Reconcile tracking issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh_retry() {
            local max=5 attempt=1 delay=2 err_file rc
            err_file=$(mktemp)
            while :; do
              if "$@" 2>"$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return 0
              fi
              rc=$?
              if [ "$attempt" -ge "$max" ] || ! grep -qiE '5[0-9]{2}|bad gateway|gateway timeout|service unavailable|rate limit|429|timeout|connection reset|EOF' "$err_file"; then
                cat "$err_file" >&2; rm -f "$err_file"; return "$rc"
              fi
              echo "::warning::transient gh failure (attempt $attempt/$max, sleeping ${delay}s): $(head -c 200 "$err_file")" >&2
              sleep "$delay"
              attempt=$((attempt+1)); delay=$((delay*2))
            done
          }

          # Index existing open tracking issues by the package name encoded in
          # the title. Title format is canonical: "Security: <pkg> — N advisory(s)"
          # so we can parse the package back out reliably.
          gh_retry gh issue list --label dependabot-alert --state open --limit 200 \
            --json number,title,body \
            > /tmp/existing-issues.json

          jq -r '.[] | "\(.number)\t\(.title)"' /tmp/existing-issues.json \
            | while IFS=$'\t' read -r num title; do
              pkg=$(echo "$title" | sed -E 's/^Security: ([^ ]+) .*/\1/')
              echo "$num $pkg"
            done > /tmp/existing-index.txt

          # Build a set of packages currently having alerts (for close logic).
          jq -r '.[].package' /tmp/alerts-grouped.json | sort -u > /tmp/active-pkgs.txt

          # Step 1: for each active package, create or update its tracking issue.
          jq -c '.[]' /tmp/alerts-grouped.json | while read -r entry; do
            pkg=$(echo "$entry" | jq -r '.package')
            severity=$(echo "$entry" | jq -r '.highest_severity')
            count=$(echo "$entry" | jq -r '.count')

            # Find existing issue for this package, if any.
            existing_num=$(awk -v p="$pkg" '$2 == p { print $1; exit }' /tmp/existing-index.txt || true)

            # Best-effort dep-tree trace. npm ls may emit stderr noise; ignore.
            tree=$(npm ls "$pkg" --all 2>/dev/null | head -15 || echo "(npm ls returned no tree)")

            # Render issue body as a here-doc. Uses the JSON entry for the
            # advisory table to avoid string-escape headaches.
            body_file=$(mktemp)
            {
              echo "## $pkg — $severity severity ($count open advisory(s))"
              echo
              echo "Auto-tracked by \`.github/workflows/dependabot-surfacing.yml\`. Closes automatically when Dependabot marks all advisories for this package resolved."
              echo
              echo "### Advisories"
              echo
              echo "| Severity | GHSA | Patched in | Summary |"
              echo "|---|---|---|---|"
              echo "$entry" | jq -r '.alerts[] | "| \(.severity) | [\(.ghsa)](\(.html_url)) | \(.patched) | \((.summary // "") | gsub("\\|"; "\\|") | .[0:100]) |"'
              echo
              echo "### Dependency chain (best-effort \`npm ls $pkg\`)"
              echo
              echo '```'
              echo "$tree"
              echo '```'
              echo
              echo "### Notes"
              echo
              echo "- **If the vulnerable package is transitive** (pulled in by a parent dep): prefer bumping the parent package over forcing the version with \`overrides\` — forced transitives can desync a framework's internal stack and break at runtime. Use \`overrides\` only as a last resort, and regression-test afterward."
              echo "- **If the chain goes through a dev-only tool** (build tooling, CLIs, devDependencies): consider whether the advisory actually affects shipped code before prioritizing."
              echo "- **Verification**: after applying a fix, re-run the workflow via the Actions tab ('Run workflow' on \`dependabot-surfacing\`) to update state immediately; otherwise state refreshes on the next weekly run."
            } > "$body_file"

            if [ -n "$existing_num" ]; then
              echo "Updating issue #$existing_num for $pkg"
              title="Security: $pkg — $count advisory(s)"
              gh_retry gh issue edit "$existing_num" \
                --title "$title" \
                --body-file "$body_file" \
                --add-label "severity-$severity" >/dev/null
            else
              echo "Creating tracking issue for $pkg"
              gh_retry gh issue create \
                --title "Security: $pkg — $count advisory(s)" \
                --body-file "$body_file" \
                --label "dependabot-alert" \
                --label "security" \
                --label "severity-$severity" >/dev/null
            fi
            rm -f "$body_file"
          done

          # Step 2: close tracking issues whose packages no longer have open alerts.
          while IFS=$' ' read -r num pkg; do
            if ! grep -qx "$pkg" /tmp/active-pkgs.txt; then
              echo "Closing #$num ($pkg) — no open alerts remain"
              gh_retry gh issue close "$num" \
                --comment "Auto-closed by \`dependabot-surfacing.yml\`: Dependabot reports no open advisories for \`$pkg\`." \
                --reason completed >/dev/null
            fi
          done < /tmp/existing-index.txt

      - name: Summary
        if: always()
        run: |
          if [ -f /tmp/alerts-grouped.json ]; then
            echo "### Dependabot surfacing reconciled" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            TOTAL_PKGS=$(jq 'length' /tmp/alerts-grouped.json)
            TOTAL_ALERTS=$(jq '[.[].count] | add // 0' /tmp/alerts-grouped.json)
            echo "- Packages with open alerts: **$TOTAL_PKGS**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Total open advisories: **$TOTAL_ALERTS**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Package | Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---------|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "| \(.package) | \(.highest_severity) | \(.count) |"' /tmp/alerts-grouped.json >> "$GITHUB_STEP_SUMMARY"
          fi
