# CI: stack-detected checks on every PR targeting main.
#
# The repo's stack is auto-detected by file presence — NO per-project config:
#   - Node    (root `package.json`)      → node-checks (dep-alignment,
#                                           workspace-tiers, stack-standard,
#                                           check-types, biome, integration
#                                           coverage, knip as steps of one
#                                           job), then vitest
#   - Python  (any `pyproject.toml`)      → ruff + pytest via uv, in each
#                                           pyproject dir (monorepo layouts like
#                                           services/<x>/ work with zero config);
#                                           pyright, else mypy, from the root
#                                           when a root pyproject.toml or
#                                           pyrightconfig.json exists
#   - Terraform (any `*.tf`)              → fmt across the repository; init
#                                           without a backend + validate in
#                                           each root (a folder holding a
#                                           committed .terraform.lock.hcl)
#   - Semgrep (always)                    → language-agnostic security scan
# A polyglot repo runs both stacks; a single-stack repo skips the other's jobs,
# and `detect` names every stack it skipped in a notice.
#
# The kit owns every line of this file outside the `project:begin` /
# `project:end` markers. The `project` job's region holds this repo's own CI
# steps; /sync-dev-kit carries them across kit updates. A region holding only
# the kit's placeholder step skips the job.
#
# GitHub bills each job by the minute, rounded up, so a check that finishes in
# seconds still bills a whole minute as a job of its own. Small checks that
# share a toolchain run as steps of one job; a job of its own is for a check
# that is long (vitest), needs other tooling (python, terraform, semgrep) or
# applies to a stack another job does not.
#
# Detection runs in a fast `detect` job (it checks out and sets outputs); the
# stack jobs and the project job gate on `needs.detect.outputs.*`. A gated-out
# job never starts a runner, so it bills nothing. We do NOT gate on `hashFiles()`
# at job level — the workspace isn't checked out when job `if:` is evaluated, so
# hashFiles would be empty and every job would skip.
#
# A gated-out job reports "skipped" (neutral) — harmless: the pipeline uses no
# branch protection (pipeline.md §1.1), and `/merge` self-gates on every
# check-run it finds, whatever its name, blocking on any failure. A skipped job
# is not a failure, so it never blocks; there are no GitHub-required checks to
# wait forever on a never-run job, and nothing to promote.
#
# NOTE: `/deploy` and `/ship-main` push DIRECTLY to main (no PR), so this
# `pull_request`-triggered workflow never runs on a release or ship-main commit.

name: ci
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
      terraform: ${{ steps.d.outputs.terraform }}
      project: ${{ steps.d.outputs.project }}
      modules: ${{ steps.d.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: d
        run: |
          set -euo pipefail
          node=false
          python=false
          terraform=false
          [ -f package.json ] && node=true
          if find . -name pyproject.toml \
               -not -path '*/.venv/*' -not -path '*/node_modules/*' \
               | grep -q .; then
            python=true
          fi
          if find . -name '*.tf' -not -path '*/.terraform/*' | grep -q .; then
            terraform=true
          fi
          # The project job runs when its region holds anything besides the
          # kit's placeholder step.
          project=true
          region=$(sed -n '/^[[:space:]]*# project:begin project-steps$/,/^[[:space:]]*# project:end project-steps$/p' .github/workflows/ci.yml \
            | sed -e 's/^[[:space:]]*//' | { grep -vE '^(#|$)' || true; })
          placeholder='- name: no project steps
          run: echo "::notice::This repository adds no CI steps of its own."'
          placeholder=$(printf '%s\n' "$placeholder" | sed -e 's/^[[:space:]]*//')
          if [ -z "$region" ] || [ "$region" = "$placeholder" ]; then
            project=false
          fi
          # Where `npm ci` puts packages, for the Node jobs' node_modules cache:
          # the root node_modules, and a workspace's own node_modules, where npm
          # puts a version that clashes with the hoisted one.
          modules=""
          if [ "$node" = true ]; then
            modules=node_modules
            while IFS= read -r glob; do
              case "$glob" in '!'*) continue ;; esac
              for dir in $glob; do
                [ -f "$dir/package.json" ] && modules="$modules"$'\n'"${dir%/}/node_modules"
              done
            done < <(jq -r '(.workspaces | if type == "object" then .packages else . end) // [] | .[]' package.json)
          fi
          {
            echo "node=$node"
            echo "python=$python"
            echo "terraform=$terraform"
            echo "project=$project"
            echo "modules<<END_OF_MODULES"
            printf '%s\n' "$modules"
            echo "END_OF_MODULES"
          } >> "$GITHUB_OUTPUT"
          echo "detected: node=$node python=$python terraform=$terraform project=$project"
          skipped=""
          [ "$node" = true ]   || skipped="$skipped Node (no root package.json: node-checks, vitest)"
          [ "$python" = true ] || skipped="$skipped Python (no pyproject.toml: ruff, pytest, typecheck)"
          [ "$terraform" = true ] || skipped="$skipped Terraform (no *.tf: fmt, validate)"
          [ "$project" = true ] || skipped="$skipped project (no project steps in the project-steps region)"
          if [ -n "$skipped" ]; then
            echo "::notice::Not detected, so their jobs are skipped:$skipped"
          fi

  # The Node checks run as steps of ONE job. GitHub bills every job by the
  # minute, rounded up, and each of these finishes in seconds — six jobs billed
  # six minutes for well under one of work, each with its own checkout and
  # install. One job checks out and installs once.
  #
  # Every step after setup carries `!cancelled()`, so a failing check does not
  # skip the rest: one run reports every failure, as separate jobs would. The
  # job fails when any step fails. The steps that need dependencies also need
  # the install to have succeeded — a failed `npm ci` is reported once, by its
  # own step, not again by every check behind it.
  #
  # The installed node_modules are cached, here and in `vitest`, under one key:
  # the runner's OS and architecture, the exact Node version, package-lock.json
  # and every package.json — so a package.json edited without its lockfile
  # still reaches `npm ci`, which refuses it. On an exact hit `npm ci` does not
  # run; a miss — or the cache service failing, which only warns — installs as
  # before, and a successful install is saved. A hit still runs the project's
  # own install scripts (preinstall, install, postinstall, prepare — root and
  # every workspace), because what they generate can live outside node_modules;
  # only the download and unpack are skipped.
  node-checks:
    name: node-checks
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the token checker's screen rules judge only the lines this PR
      # changes, measured from where it left its base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Monorepo invariant: every shared dependency is ONE version across all
      # workspaces. Dependabot bumps each manifest independently and cannot see
      # cross-app drift, so this gate is what screams the moment a dep diverges —
      # the class of skew that causes "works in one app, breaks in another"
      # outages. It reads package.json files only, so it runs before the install.
      # On a single-package repo (no `workspaces`) it's a guaranteed pass.
      # Discipline: DEPENDENCY-MANAGEMENT.md in the kit. Ships via
      # _claude-project/templates/scripts/.
      - name: dep-alignment
        if: ${{ !cancelled() }}
        run: node scripts/check-dep-alignment.mjs

      # The one invariant: database code and browser code never share a package.
      # The script DETECTS which tiers exist (server-shared, ui, web, headless
      # apps) and enforces only the walls the repo actually has — a repo with no
      # shared workspace is a guaranteed pass. Doctrine: .claude/rules/ui-design.md,
      # "The client/server wall". Ships via _claude-project/templates/scripts/.
      - name: workspace-tiers
        if: ${{ !cancelled() }}
        run: node scripts/check-workspace-tiers.mjs

      # TanStack publishes no LTS — no `lts` dist-tag, no support window, just one
      # rolling line per library. So the KIT is the LTS: one blessed version per
      # package in .claude/stack-manifest.json and every project runs it. This
      # gate enforces exact pins (a caret range drifts off the blessed version on
      # a fresh install), keeps banned form libraries out (`npx shadcn add form`
      # pulls react-hook-form as a hard dep, which type-checks and builds and
      # surfaces months later), and fails when a front-end app has never ANSWERED
      # the form-library question. Hermetic: no network, reads manifests only. A
      # repo with no @tanstack/* dependency exits 0 in silence. Ships via
      # _claude-project/templates/scripts/.
      - name: stack-standard
        if: ${{ !cancelled() }}
        run: node scripts/check-stack.mjs

      - id: modules
        name: restore node_modules
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ needs.detect.outputs.modules }}
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', '**/package.json') }}
      - id: install
        name: npm ci
        if: ${{ !cancelled() }}
        env:
          CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            echo "node_modules came from the cache for this package-lock.json, so npm ci did not run; running the project's install scripts."
            for script in preinstall install postinstall prepare; do
              npm run "$script" --workspaces --include-workspace-root --if-present
            done
          else
            npm ci
          fi
      - name: save node_modules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ needs.detect.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}

      # Applies when package.json declares `check-types` or the repository has
      # TypeScript sources of its own — then a missing script fails. The commit
      # gate asks the same question (gitflow gates.sh has_typescript_sources); the
      # root knip.config.ts is the kit's, not the project's.
      - id: types
        name: does check-types apply
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ts=$(git ls-files -- '*.ts' '*.tsx' '*.mts' '*.cts' | { grep -vE '(^|/)(node_modules|\.claude|dist)/' || true; } | { grep -vxF knip.config.ts || true; })
          if jq -e '.scripts["check-types"] | strings' package.json >/dev/null || [ -n "$ts" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::check-types does not apply: no TypeScript sources."
          fi
      - name: check-types
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.types.outputs.run == 'true' }}
        run: npm run check-types

      # `@biomejs/biome` explicitly, and `--no-install`. A bare `npx biome`
      # resolves to an UNRELATED package of that name on npm, which accepts
      # `lint` as an unknown command and EXITS 0 — so the check reported success
      # without linting. Worse on a runner than locally: without `--no-install`,
      # npx DOWNLOADS and executes whatever the registry currently serves under
      # that name, install scripts included, inside a checked-out repo.
      # `--no-install` makes the step fail when the linter is not a declared
      # devDependency, which is the correct outcome: a gate that cannot run must
      # not pass.
      - name: biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install @biomejs/biome lint
      # Every design token family is set by a role (the design-system skill).
      # Biome cannot see this: a raw `text-sm` or `rounded-[6px]` is valid
      # Tailwind and valid TSX, and it is exactly how one thing ends up at four
      # sizes. A repo with a design.md has a design system, so both checks are
      # required and a missing script fails the step: `lint:tokens` runs the
      # kit's token checker, `lint:design` validates design.md against its
      # spec. Without a design.md neither applies, and the step says so.
      - name: design checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DESIGN_TOKENS_BASE: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          if [ -f design.md ]; then
            npm run lint:tokens
            npm run lint:design
          else
            echo "::notice::No design.md at the repository root, so the design checks (lint:tokens, lint:design) do not apply."
          fi

      # The integration tier's ratchet (testing-verification.md): every exported
      # function this PR changed that queries the database has an integration
      # test calling it, and every changed `.execute()` carries a `raw-sql:`
      # reason. Untouched code is counted, never failed. A declared
      # INTEGRATION_CI_OFF skips it, quoting the reason; the check stands down on
      # its own, saying why, for DB_ENGINE None or a repository with no
      # TypeScript. It reads source with TypeScript, so it needs the install.
      - name: integration coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ci_off=""
          [ -f .claude/sync-substitutions.json ] && ci_off=$(jq -r '.INTEGRATION_CI_OFF // "" | strings' .claude/sync-substitutions.json)
          if [ -n "$ci_off" ]; then
            echo "::notice::Integration tests are declared off in CI (INTEGRATION_CI_OFF): $ci_off"
            exit 0
          fi
          node scripts/check-integration-coverage.mjs --base "origin/$BASE_REF" --report-untested

      # Unused code: files, exports, types and dependencies nothing uses, and
      # imports of packages a workspace never declares. The kit's knip.config.ts
      # is the whole configuration — there is no per-project ignore list, so a
      # finding that is not dead code is a kit defect to raise, never a line to
      # silence here. The gate is the project's call, KNIP_GATE in
      # .claude/sync-substitutions.json, because a codebase reaches zero findings
      # once, in a cleanup, before the gate can hold it there (pipeline.md §3.9).
      # The knip version is the stack manifest's.
      - id: knip-gate
        name: KNIP_GATE
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          subs=.claude/sync-substitutions.json
          gate=""
          listed=false
          if [ -f "$subs" ]; then
            gate=$(jq -r '.KNIP_GATE // ""' "$subs")
            listed=$(jq -r '(._intentionally_empty // []) | index("KNIP_GATE") != null' "$subs")
          fi
          case "$gate" in
            true)
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            "")
              echo "run=false" >> "$GITHUB_OUTPUT"
              if [ "$listed" = true ]; then
                echo "::notice::KNIP_GATE is off for this repository (listed in _intentionally_empty), so unused code is not gated."
              else
                echo "::warning::KNIP_GATE is undecided in .claude/sync-substitutions.json, so unused code is not gated. Reach zero knip findings, then set it to \"true\" — or list it in _intentionally_empty to decide against the gate."
              fi ;;
            *)
              echo "::error::KNIP_GATE is \"$gate\" — the only values are \"true\", or empty and listed in _intentionally_empty."
              exit 1 ;;
          esac
      # The symbols reporter heads each finding type with its count; the
      # github-actions reporter puts every finding on the PR diff. Exit 1 on
      # any finding, 2 when knip itself cannot run — both fail the step. Knip
      # loads the project's Vite and Vitest configs, which import its installed
      # packages, so it needs the install.
      - name: knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.knip-gate.outputs.run == 'true' }}
        run: npx --yes knip@6.41.0 --no-progress --no-config-hints --reporter symbols --reporter github-actions

  # The full suite runs once per code fingerprint (code-fingerprint.mjs in the gitflow
  # skill): one hash of the tree, comments and whitespace left out of TypeScript and
  # JavaScript. The tree is the checked-out commit — the PR merged into main, the code
  # the suite tests. Each run records its result on the PR's head commit as the `full-suite`
  # status, whose description carries that fingerprint (the name and the format live in
  # code-fingerprint.mjs, FULL_SUITE). When an earlier commit of this PR passed on the
  # same fingerprint, the suite does not run again: the pass is carried forward, and says
  # from where. /deploy reads the same status, and skips its own run of the suite on code
  # that has one.
  #
  # Under TEST_RUNNER=aws (the project's value in .claude/sync-substitutions.json, resolved by
  # the gitflow skill's settings.sh; no .env here) the full suite runs in the project's
  # CodeBuild test project instead, which reports `full-suite` to the PR itself: this job
  # runs the unit tests only, and records nothing.
  vitest:
    name: vitest
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      # globalSetup.ts reads these to fork ONE ephemeral Neon branch per run
      # for the integration tests (~$0.01/run). API_KEY + PROJECT_ID gate the
      # integration project on (vitest.config.ts): both present → integration
      # tests run; absent → unit-only. DATABASE_NAME + ROLE_NAME are optional
      # but typically needed when the app's schema lives in a non-default DB.
      # All four live in repo Secrets — see testing.md §1. Add via:
      # Settings → Secrets and variables → Actions.
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ secrets.NEON_ROLE_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A declared `test` script always runs. Without one, the job applies when
      # the root package or a workspace holds a vitest config or a *.test.* /
      # *.spec.* file — and then fails, because nothing would run them. A nested
      # directory with its own package.json that is no workspace owns its tests
      # (knip.config.ts treats it as its own package the same way).
      - id: applies
        name: does the test job apply
        run: |
          set -euo pipefail
          if jq -e '.scripts.test | strings' package.json >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workspaces=" "
          while IFS= read -r glob; do
            for dir in $glob; do
              [ -f "$dir/package.json" ] && workspaces="$workspaces${dir%/} "
            done
          done < <(jq -r '(.workspaces | if type == "object" then .packages else . end) // [] | .[]' package.json)
          foreign=$(mktemp)
          git ls-files -- '*/package.json' | { grep -vE '(^|/)(node_modules|\.claude|dist)/' || true; } \
            | while IFS= read -r manifest; do
                dir=$(dirname "$manifest")
                case "$workspaces" in *" $dir "*) ;; *) printf '%s/\n' "$dir" ;; esac
              done > "$foreign"
          found=$(git ls-files -- '*.test.*' '*.spec.*' 'vitest.config.*' '*/vitest.config.*' 'vitest.*.config.*' '*/vitest.*.config.*' \
            | { grep -E '(^|/)vitest\.|\.(test|spec)\.[cm]?[jt]sx?$' || true; } \
            | { grep -vE '(^|/)(node_modules|\.claude|dist)/' || true; } \
            | awk -v foreign="$foreign" 'BEGIN { while ((getline d < foreign) > 0) owned[d] = 1 }
                { for (d in owned) if (index($0, d) == 1) next; print }')
          if [ -n "$found" ]; then
            echo "::error::This repository has tests, but package.json declares no \"test\" script, so nothing runs them. Add one (testing.md §1)."
            printf '%s\n' "$found"
            exit 1
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::The test job does not apply: package.json declares no \"test\" script and the repository has no vitest config or test files."
      - id: runner
        name: where the full suite runs
        if: steps.applies.outputs.run == 'true'
        run: |
          set -uo pipefail
          script=.claude/skills/gitflow/scripts/settings.sh
          if [ ! -f "$script" ]; then
            echo "::notice::$script is missing (run /sync-dev-kit), so the full suite runs here, on GitHub Actions."
            echo "runner=github" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runner=$(bash "$script" TEST_RUNNER --no-env) || exit 1
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          if [ "$runner" = aws ]; then
            echo "::notice::TEST_RUNNER is aws: the full suite runs in the project's CodeBuild test project, which reports full-suite to this PR. This job runs the unit tests only and records nothing."
          else
            echo "The full suite runs here (TEST_RUNNER is github)."
          fi
      - id: node
        if: steps.applies.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # node_modules from the cache on an exact hit, as in node-checks.
      - id: modules
        if: steps.applies.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ needs.detect.outputs.modules }}
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', '**/package.json') }}
      - if: steps.applies.outputs.run == 'true'
        env:
          CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            for script in preinstall install postinstall prepare; do
              npm run "$script" --workspaces --include-workspace-root --if-present
            done
          else
            npm ci
          fi
      - if: steps.applies.outputs.run == 'true' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ needs.detect.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The integration gate (testing.md §3). The integration project is
      # dropped when it cannot reach its database — on PostgreSQL, when the Neon
      # secrets are absent — and the run still passes, so integration tests that
      # exist but never ran would read as green. They must run unless the
      # project declares why CI cannot run them (INTEGRATION_CI_OFF). Dependabot PRs are the one exception: GitHub
      # runs them without the repository's Actions secrets, and their unit tests
      # are still real signal.
      - id: integration
        name: must the integration tests run
        if: steps.applies.outputs.run == 'true' && steps.runner.outputs.runner != 'aws'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          subs=.claude/sync-substitutions.json
          engine=""; ci_off=""
          if [ -f "$subs" ]; then
            engine=$(jq -r '.DB_ENGINE // "" | strings' "$subs")
            ci_off=$(jq -r '.INTEGRATION_CI_OFF // "" | strings' "$subs")
          fi
          files=$(git ls-files -- '*.integration.test.ts' '*.integration.test.tsx' '*.integration.test.mts' ':(exclude)*.dev.integration.test.*' | { grep -vE '(^|/)node_modules/' || true; })
          required=false
          if [ -z "$files" ]; then
            echo "::notice::The repository has no integration tests, so none must run."
          elif [ "$engine" = "None" ]; then
            echo "::notice::DB_ENGINE is None, so the integration tests are not required."
          elif [ -n "$ci_off" ]; then
            echo "::notice::Integration tests are declared off in CI (INTEGRATION_CI_OFF): $ci_off"
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Dependabot PRs run without the repository's secrets, so the integration tests are not required here."
          elif [ "$engine" = "PostgreSQL" ] && { [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; }; then
            echo "::error::This repository has integration tests, but the NEON_API_KEY or NEON_PROJECT_ID secret is empty, so they would be skipped. Add both under Settings → Secrets and variables → Actions (testing.md §1), or declare why CI cannot run them in INTEGRATION_CI_OFF."
            printf '%s\n' "$files"
            exit 1
          else
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      # Whether an earlier commit of this PR passed the full suite on this exact code.
      # After the install: the fingerprint reads code with the project's TypeScript.
      # GitHub unreadable, or no fingerprint, runs the suite.
      - id: record
        name: has this exact code passed the full suite
        if: steps.applies.outputs.run == 'true' && steps.runner.outputs.runner != 'aws'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          script=.claude/skills/gitflow/scripts/code-fingerprint.mjs
          if [ ! -f "$script" ]; then
            echo "::notice::$script is missing (run /sync-dev-kit), so no pass can be carried forward — the suite runs."
            exit 0
          fi
          # The checked-out commit, not the working tree: what the install scripts
          # generate is not the code, and /deploy fingerprints a commit too.
          if ! fp=$(node "$script" --commit HEAD); then
            echo "::warning::The code fingerprint could not be computed — the suite runs."
            exit 0
          fi
          context=$(node "$script" --status-context)
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          echo "code fingerprint: $fp"
          if ! shas=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].sha' 2>&1); then
            echo "::warning::GitHub could not list this PR's commits, so no earlier pass can be found — the suite runs. $shas"
            exit 0
          fi
          for sha in $(printf '%s\n' "$shas" | tac); do
            if ! desc=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
                --jq ".statuses[] | select(.context == \"$context\" and .state == \"success\") | .description" 2>&1); then
              echo "::warning::GitHub could not read the statuses of $sha — the suite runs. $desc"
              exit 0
            fi
            [ -n "$desc" ] || continue
            if [ "$(node "$script" --status-fp "$desc" || true)" = "$fp" ]; then
              echo "from=$sha" >> "$GITHUB_OUTPUT"
              echo "::notice::The full suite passed on this exact code at $sha — carried forward, not run again."
              exit 0
            fi
          done
          echo "No earlier commit of this PR passed the full suite on this code — the suite runs."
      # NO_COLOR keeps vitest's project labels plain: on a runner, where `CI` is
      # set, it otherwise prints each one as a coloured badge with no `|` around it.
      - if: steps.applies.outputs.run == 'true' && steps.runner.outputs.runner != 'aws' && steps.record.outputs.from == ''
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"
      - name: unit tests (the full suite runs in CodeBuild)
        if: steps.applies.outputs.run == 'true' && steps.runner.outputs.runner == 'aws'
        run: npm test -- --project unit
      # vitest labels each file of a named project, so `|integration|` in the
      # output is the integration project having run. A carried-forward pass ran
      # the suite, and this check, on the commit it came from.
      - name: integration tests ran
        if: ${{ !cancelled() && steps.integration.outputs.required == 'true' && steps.record.outputs.from == '' }}
        run: |
          if ! grep -qF '|integration|' "$RUNNER_TEMP/vitest.log"; then
            echo "::error::This repository has integration tests, but the integration project did not run. On another engine than PostgreSQL, register it in test/project.ts under the name \"integration\" (the engine rule says how), or declare why CI cannot run it in INTEGRATION_CI_OFF (testing.md §3)."
            exit 1
          fi
          echo "The integration project ran."
      # The record: `full-suite` on the PR's head commit, success or failure, carrying the
      # fingerprint. Last, so a failure in any step above is a failure here. GitHub
      # gives a Dependabot PR's run a read-only token, so its run records nothing; a
      # record that cannot be posted costs only a later reuse, so it warns.
      - name: record the full suite
        if: ${{ !cancelled() && steps.record.outputs.fp != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          JOB_STATUS: ${{ job.status }}
          FP: ${{ steps.record.outputs.fp }}
          FROM: ${{ steps.record.outputs.from }}
        run: |
          set -uo pipefail
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Dependabot PRs run with a read-only token, so the full suite's result is not recorded."
            exit 0
          fi
          script=.claude/skills/gitflow/scripts/code-fingerprint.mjs
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          if [ -n "$FROM" ]; then
            description=$(node "$script" --status-description "$FP" --from "$FROM")
          else
            description=$(node "$script" --status-description "$FP")
          fi
          context=$(node "$script" --status-context)
          if ! out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$state" -f context="$context" -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" 2>&1); then
            echo "::warning::The full suite's result could not be recorded on $HEAD_SHA, so a later run or /deploy will run the suite again. $out"
            exit 0
          fi
          echo "Recorded $context: $state — $description"

  python:
    name: python
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      # ruff + pytest in each pyproject.toml dir (excludes vendored venvs).
      # Shop standard is uv; a Python project on poetry/pip instead needs this
      # job taught its toolchain (same way the Node jobs hardcode npm). uv sync
      # installs dev deps (ruff/pytest) by default and auto-provisions the
      # Python pinned in pyproject/.python-version.
      - name: ruff + pytest (uv) per pyproject
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' pp; do
            dir="$(dirname "$pp")"
            echo "::group::$dir"
            (
              cd "$dir"
              uv sync || exit 1
              uv run ruff check . || exit 1
              # pytest exit 5 = "no tests collected": passes, and says so
              uv run pytest -q; rc=$?
              if [ "$rc" -eq 5 ]; then
                echo "::warning::$dir: pytest collected no tests"
              elif [ "$rc" -ne 0 ]; then
                exit 1
              fi
            ) || fail=1
            echo "::endgroup::"
          done < <(find . -name pyproject.toml \
                     -not -path '*/.venv/*' -not -path '*/node_modules/*' -print0)
          exit "$fail"
      # The commit gate's typecheck (gates.sh run_typecheck_gate), same scope and
      # same choice: a root pyproject.toml or pyrightconfig.json runs pyright,
      # else mypy. From the root
      # because pyright reads its config only from the directory it is launched
      # in (python-rules.md). Pyright is always the stack manifest's pin,
      # installed over whatever version the project declares, and stack-standard
      # fails when this line names any other. mypy runs only when the root
      # pyproject.toml declares mypy and not pyright.
      - name: typecheck (pyright, else mypy)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            run=(uv run)
          elif [ -f pyrightconfig.json ]; then
            run=(uv run --no-project)
          else
            echo "::notice::No pyproject.toml or pyrightconfig.json at the repository root, so the Python typecheck does not apply — the commit gate skips it too."
            exit 0
          fi
          has() { [ -f pyproject.toml ] && uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('$1') is None)" >/dev/null 2>&1; }
          if has mypy && ! has pyright; then
            echo "typecheck: mypy ., from the repository root"
            uv run mypy .
          else
            echo "typecheck: pyright 1.1.414 (the stack manifest's pin), from the repository root"
            PYRIGHT_PYTHON_IGNORE_WARNINGS=1 "${run[@]}" --with pyright==1.1.414 pyright --stats
          fi

  # Formatting across every .tf file, then each root validated on its own.
  # A root is a folder with a committed .terraform.lock.hcl (infrastructure-
  # terraform.md); a module has none and is validated through the roots that
  # call it. `init -backend=false` downloads the locked providers and touches no
  # state and no AWS account, so the job needs no credentials.
  terraform:
    name: terraform
    needs: detect
    if: ${{ needs.detect.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate each root
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          fail=0
          roots=0
          while IFS= read -r lock; do
            dir="$(dirname "$lock")"
            roots=$((roots + 1))
            echo "::group::$dir"
            if ! terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly >/dev/null; then
              echo "::error::$dir: terraform init failed"
              fail=1
            elif ! terraform -chdir="$dir" validate; then
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name .terraform.lock.hcl -not -path '*/.terraform/*')
          if [ "$roots" -eq 0 ]; then
            echo "::error::This repository has Terraform but no root with a committed .terraform.lock.hcl, so nothing was validated. Run terraform init in each root and commit its lock file."
            exit 1
          fi
          echo "validated $roots root(s)"
          exit "$fail"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # On Dependabot PRs, emit a notice and succeed (the check still reports a
      # SUCCESS status so a `semgrep` required-check, if configured, is satisfied
      # and the dep-bump PR can merge). Dependabot PRs only change
      # `package.json` / lockfile — no application source for Semgrep to scan;
      # Dependabot's own vulnerability alerts are the real gate for dep security.
      - name: Skip scan for Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "::notice::Semgrep skipped for Dependabot PR — lockfile-only diff has no source for scanning."
      # On every other PR, run the real scan. `--error` fails the job on any
      # finding so CI blocks the merge.
      #
      # Project-specific `--exclude-rule` flags belong here when a finding is
      # addressed by a real config-level fix the rule's pattern matcher cannot
      # detect (constitution §XIII option 3). Document each exclusion at the fix
      # site so the rule's concern can be re-verified. `.semgrepignore` (pipeline.md §3.2)
      # handles file-pattern excludes (binaries, design assets, lockfiles).
      - name: Run Semgrep
        if: github.actor != 'dependabot[bot]'
        run: |
          semgrep scan --config auto --error

  # This repository's own CI steps. Everything between the markers belongs to
  # the project and survives every kit sync; the job around them is the kit's.
  # The checkout is done — a step that needs Node or Python sets it up first.
  # Replace the placeholder step with the project's own and the job runs;
  # `detect` skips it while the placeholder is all the region holds.
  project:
    name: project
    needs: detect
    if: ${{ needs.detect.outputs.project == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # project:begin project-steps
      - name: no project steps
        run: echo "::notice::This repository adds no CI steps of its own."
      # project:end project-steps
